on:
  pull_request:
    branches: [master]

jobs:
  code-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run test

      - run: npm audit --audit-level=moderate
